<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="מערכת ניהול בקשות שילוט - עיריית אשדוד" />
    <title>שילוט אשדוד</title>
    <!--
      GitHub Pages SPA fallback: 404.html stores the requested path in the URL
      query string; this snippet restores it into history before the app boots,
      so deep links / refreshes work with client-side routing.
    -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <script src="https://appofapp-gh.vercel.app/ai-menu.js"></script>
    <!-- Ashdod streets, shared by the municipal apps (AppOfApp-GH docs/streets-standard.md): Pages first, Vercel second -->
    <script src="https://anat1969.github.io/AppOfApp-GH/streets.js" onerror="var s=document.createElement('script');s.src='https://appofapp-gh.vercel.app/streets.js';document.head.appendChild(s)" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
